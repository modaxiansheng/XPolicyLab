[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "rsiwam-frozen-runtime"
version = "0.1.0"
description = "Frozen RecoverWAM runtime for the RSIWAM XPolicyLab eval-only adapter"
requires-python = ">=3.10"
dependencies = []

[tool.setuptools.packages.find]
where = ["bundle/src"]
include = ["recoverwam*"]

[tool.setuptools.package-dir]
"" = "bundle/src"
